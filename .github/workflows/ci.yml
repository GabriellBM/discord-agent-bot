name: CI Checks

on:
  push:
    branches:
      - main
      - develop
      - homolog
  pull_request:
    branches:
      - main
      - develop
      - homolog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure local env files are not tracked
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)"

          if [ -n "$tracked_env_files" ]; then
            echo "The following env files are tracked and should not be committed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Ensure runtime level database is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch src/data/levels.json >/dev/null 2>&1; then
            echo "src/data/levels.json contains runtime data and must not be tracked."
            exit 1
          fi

      - name: Check required project files
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f tsconfig.json
          test -f .env.example
          test -f src/index.ts

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: repository-safety

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
