services:
  discord-agent-bot:
    image: ${PROJECT_NAME:-discord-agent-bot}:v${APP_VERSION:-1.1.0}
    build:
      context: .
    container_name: discord-agent-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LEVELS_FILE_PATH: /app/data/levels.json
    volumes:
      - ./data:/app/data
